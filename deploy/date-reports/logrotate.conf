# Access history feeds Nigeria-time reports; rotate daily rather than by size.
# Existing numbered archives remain preserved until reviewed by the operator.
/opt/rms/docker/monitoring/apache/laravel_access.log /opt/rms/docker/monitoring/apache/laravel_external_access.log {
    daily
    rotate 30
    dateext
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

# Preserve the existing error-log storage policy independently of access history.
/opt/rms/docker/monitoring/apache/laravel_error.log /opt/rms/docker/monitoring/apache/error.log /opt/rms/docker/monitoring/apache/other_vhosts_access.log {
    size 50M
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
