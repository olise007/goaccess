server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index live.html;
    client_max_body_size 1k;
    location /api/ {
        proxy_set_header Host $http_host;
        proxy_pass http://127.0.0.1:8080;
    }
    location /reports/ {
        location ~ /\. { deny all; }
        add_header Cache-Control 'no-store';
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control 'no-cache';
        try_files $uri $uri/ =404;
    }
}
