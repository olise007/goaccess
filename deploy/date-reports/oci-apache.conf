# Disable HTTP/2 to prevent "Misdirected Request" errors
Protocols http/1.1

<IfModule mpm_prefork_module>
    StartServers             5
    MinSpareServers          5
    MaxSpareServers         10
    MaxRequestWorkers        80
    MaxConnectionsPerChild   2000
</IfModule>

# Set HTTPS variable based on X-Forwarded-Proto header from Cloudflare
# This allows Laravel to detect HTTPS requests behind the proxy tunnel
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

RemoteIPHeader CF-Connecting-IP
# Trust only the tunnel address pinned in OCI Compose, never the whole bridge.
RemoteIPTrustedProxy 172.28.0.8

# Keep the effective client address supplied by the trusted Cloudflare tunnel.
LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" rms_client_combined

# Preserve all requests in the audit log; keep private-source probes out of Live.
SetEnvIfExpr "-R '0.0.0.0/32' || -R '10.0.0.0/8' || -R '100.64.0.0/10' || -R '127.0.0.0/8' || -R '169.254.0.0/16' || -R '172.16.0.0/12' || -R '192.168.0.0/16' || -R '::/128' || -R '::1/128' || -R 'fc00::/7' || -R 'fe80::/10'" rms_internal_source

# Ensure the main public directory is accessible
<Directory "/var/www/html/public">
    Options FollowSymLinks MultiViews
    AllowOverride All
    Require all granted
</Directory>

# Catch-all for main domain and all subdomains (Laravel handles routing)
<VirtualHost *:80>
    ServerName rms.net.ng
    ServerAlias *.rms.net.ng localhost
    
    DocumentRoot /var/www/html/public
    DirectoryIndex index.php

    ErrorLog ${APACHE_LOG_DIR}/laravel_error.log
    CustomLog ${APACHE_LOG_DIR}/laravel_access.log rms_client_combined
    CustomLog ${APACHE_LOG_DIR}/laravel_external_access.log rms_client_combined env=!rms_internal_source
</VirtualHost>
